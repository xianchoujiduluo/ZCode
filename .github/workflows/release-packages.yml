# 本文件已在 B 机(Ubuntu 24.04 / Node 24.14.0 / pnpm 10.33.2)上验证过 install 与打包环节，结论写在下方注释里。
# 两种触发方式：
#   1) push tag (v*)  —— 自动出包并创建/更新 GitHub Release
#   2) workflow_dispatch —— 手动出包，只存 Actions Artifacts，不建 Release
# 注意：push 触发时 inputs.* 全为空，所有默认值都靠 vars / 字面量兜底，不能只写 inputs。

name: release-packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_remote_assets:
        description: "桌面安装包内置远端(SSH/WSL/Docker)组件。开启后构建时间显著变长"
        type: boolean
        default: false
      dist_base_url:
        description: "Web+Agent 发行包 install.sh 的下载根地址。留空则读仓库变量 ZCODE_DIST_BASE_URL"
        type: string
        default: ""
      release_version:
        description: "版本号，留空时：tag 触发取 tag 名(去 v)，手动触发取根 package.json"
        type: string
        default: ""
      production_backend:
        description: "桌面包连生产后端(ZCODE_ENV=production)。不开则后端环境为 test，产物名带 _TEST"
        type: boolean
        default: true

# 三个构建 job 都只写各自的 dist 目录，互不冲突；但 git 工作区共享，所以串行更省心。
concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

# 最小权限：构建只需读，只有 publish 需要写 Release（单独在 job 上提权）。
# 仓库当前 actions/permissions/workflow 的 default_workflow_permissions = read，
# 不显式提权的话发布 Release 会 403。
permissions:
  contents: read

env:
  # 锁定 mise.toml 里的工具链
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"
  # husky 的 prepare 在 CI 里没有意义，关掉避免 install 阶段干扰
  # （实测：HUSKY=0 会让 prepare 脚本输出 "HUSKY=0 skip install"，不会失败）
  HUSKY: "0"
  # 实测：@zcode/desktop 的 postinstall 在非 Windows 上必定执行 electron-rebuild，
  # 日志为 "[node-pty] run electron-rebuild (non-windows-platform)"，成功后打印 "✔ Rebuild Complete"。
  # 这条决定了 ubuntu/windows runner 都必须在装依赖前具备原生工具链。
  # 桌面包的后端环境轴。desktop-product-identity.mjs 的 normalizeDesktopZCodeEnv 是
  # 「不写 production 就当 test」，实测 B 机未设此变量时产物名为
  # "ZCode Preview-3.14.0-linux-x86_64_TEST.AppImage"（+_TEST 后缀、Preview 身份）。
  # 要出正式包必须显式 production。
  # tag 触发时 inputs.production_backend 为空（falsy），所以必须显式区分事件来源，
  # 否则 tag 发布会被静默降级成 _TEST 测试包。
  ZCODE_ENV: ${{ github.event_name == 'workflow_dispatch' && (inputs.production_backend && 'production' || 'test') || 'production' }}
  # 实测：mise.toml 里的 ELECTRON_MIRROR(npmmirror) 已 404 失效，
  # 必须显式指到官方 Releases；同时 @electron/get 不读 https_proxy，需要 ELECTRON_GET_USE_PROXY。
  # 下面两个变量给国内 runner / 自建 runner 用；GitHub 官方 runner 可直连，留空即可。
  ELECTRON_MIRROR: ${{ vars.ELECTRON_MIRROR || 'https://github.com/electron/electron/releases/download/' }}
  ELECTRON_GET_USE_PROXY: ${{ vars.ELECTRON_GET_USE_PROXY || '' }}
  # 仓库注释明确：Windows 桌面安装包不依赖 mock-cdn remote 资产，跳过可避免串行下载拉长 CI
  # include_remote_assets=true 时不设此变量，由 prepare:runtime-assets 走完整流程
  # tag 触发时 inputs 为空，表达式短路到 '1'（即默认跳过），符合预期
  ZCODE_SKIP_REMOTE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_remote_assets && '0' || '1' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) Windows 桌面安装包（Electron，内置 Agent）
  #    产物：NSIS .exe，来自 packages/desktop/electron-builder.config.js 的 win.target
  # ─────────────────────────────────────────────────────────────
  desktop-windows:
    name: desktop / win-x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Windows 上 @zcode/desktop 的 postinstall(node-pty-rebuild) 会命中 N-API 预编译直接跳过，
      # 不需要 VS Build Tools。System32 的 bsdtar 由 OS 自带，stage 阶段会校验它存在。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # bundle:desktop 内部会依次执行 prepare:runtime-assets → build → electron-builder → 产物校验。
      # 不要绕过它直接调 electron-builder，否则会跳过 app.asar 依赖闭包与 native 越界校验。
      - name: Build desktop installer (win-x64)
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml

  # ─────────────────────────────────────────────────────────────
  # 2) Linux 桌面安装包（Electron，内置 Agent）
  #    产物：AppImage / deb / rpm / pacman(.pkg.tar.zst)
  # ─────────────────────────────────────────────────────────────
  desktop-linux:
    name: desktop / linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # @zcode/desktop 的 postinstall 在非 Windows 上强制 electron-rebuild，
      # 需要 python3 + make + g++（ubuntu runner 自带，这里显式补打包 target 需要的工具）。
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot zstd libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop installer (linux-x64)
        run: pnpm bundle:desktop -- --os linux --arch x64

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-linux.yml

  # ─────────────────────────────────────────────────────────────
  # 3) Linux Web + Agent 发行包（浏览器访问，不带 Electron）
  #    产物：dist/zcode/{install.sh,latest.json,sha256.txt,releases/<ver>/zcode-<ver>.tar.gz}
  #    包内结构：web/ + server/ + agent/zcode.cjs，由 bin/zcode.mjs 启动
  # ─────────────────────────────────────────────────────────────
  web-agent-linux:
    name: web+agent / linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 需要 linux-arm64 时在矩阵里加一行即可（runner 仍是 x64，属交叉打包，产物未在真机验证）。
        # 警告：一旦加多架构，flatten 阶段会因 install.sh / latest.json / sha256.txt
        # 同名而硬失败（publish-release 里会报“资产名冲突”）。到那时需要先给资产加
        # 架构前缀，或者只发布单架构。
        arch: [x64]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 实测结论：pnpm install --frozen-lockfile 在根目录就能完整覆盖嵌套的 apps/zcode-cli
      # workspace（日志 "Scope: all 33 workspace projects"），pnpm ls -r 能看到 @zcode/cli、
      # @zcode/core、@zcode/tui、@zcode/adapters、@zcode/contracts，内层 node_modules/@zcode
      # 也已正确链接。所以不需要额外进 apps/zcode-cli 再跑一次 install。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ★ 此处原有一个阻断缺陷，已在 B 机复现并修复（改动在本 commit 内）：
      # build:zcode 经 stageTuiRuntime → collectSeaTuiAssets → resolveRuntimePackageDirectory，
      # 该函数对 workspace 包硬校验 <pkg>/dist/index.js（sea-runtime-package-resolution.mjs:37），
      # 而 @zcode/shared 的 exports 直指 ./src/index.ts、且原先没有 build 脚本，永远不会有 dist。
      # 报错：Error: Missing @zcode/shared dist files. Run `pnpm build` before `pnpm sea`.
      # 修复：packages/shared 补 "build": "tsc"（tsconfig 早已配好 outDir=dist），
      #       并让 build-zcode.mjs 的构建列表带上 @zcode/shared。
      # B 机实测：修复后 pnpm build:zcode 返回 EXIT=0，产出 78MB tarball。
      # base-url 必填（缺失时 build-zcode.mjs:241 直接 throw），优先级：
      #   手动触发的 inputs > 仓库变量 ZCODE_DIST_BASE_URL > 报错提示
      # 注意：GitHub Release 的资产是扁平结构，而生成的 install.sh 硬编码了
      # ${BASE_URL}/releases/$VERSION/$TARBALL 目录层级，所以这个 base-url 只能指向
      # 自建/自托管的下载站点（保留 dist/zcode 整棵目录结构），不能直接指向 Release 资产。
      # Release 上的资产仅作下载分发；如需从 Release 安装，需先设 ZCODE_DIST_BASE_URL。
      - name: Build web + agent distribution
        env:
          ZCODE_TARGET_ARCH: ${{ matrix.arch }}
          DIST_BASE_URL: ${{ inputs.dist_base_url || vars.ZCODE_DIST_BASE_URL }}
          # 末尾的 || '' 不可省：手动触发且 release_version 为空时，
          # (github.event_name == 'push' && ...) 会求值为布尔 false，
          # 而布尔值渲染成字符串就是 "false"，会让版本号变成 zcode-false.tar.gz。
          RELEASE_VERSION: ${{ inputs.release_version || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          if [ -z "$DIST_BASE_URL" ]; then
            echo "::error::缺少 dist_base_url。请传 workflow 输入 dist_base_url，或设置仓库变量 ZCODE_DIST_BASE_URL。" >&2
            exit 1
          fi
          # tag 触发时 tag 名为 vX.Y.Z，而产物的 version 字段不带 v 前缀
          VERSION="${RELEASE_VERSION#v}"
          echo "base-url=$DIST_BASE_URL version=$VERSION"
          if [ -n "$VERSION" ]; then
            pnpm build:zcode --base-url "$DIST_BASE_URL" --version "$VERSION"
          else
            pnpm build:zcode --base-url "$DIST_BASE_URL"
          fi

      # 发行包必须自检：install.sh 依赖 latest.json 里的 version/tarball 字段，缺了装不上。
      # 实测产物结构（B 机验证）：
      #   dist/zcode/{install.sh,latest.json}
      #   dist/zcode/releases/<version>/{zcode-<version>.tar.gz,sha256.txt}
      # 注意 sha256.txt 在 releases/<version>/ 下，不在 dist/zcode/ 根。
      - name: Verify distribution layout
        run: |
          set -euo pipefail
          test -f dist/zcode/latest.json
          test -f dist/zcode/install.sh
          ls -1 dist/zcode/releases/*/zcode-*.tar.gz
          ls -1 dist/zcode/releases/*/sha256.txt
          node -e 'const m=require("./dist/zcode/latest.json");if(!m.version||!m.tarball)throw new Error("latest.json 缺少 version/tarball");console.log("version="+m.version,"tarball="+m.tarball)'

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-agent-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          # 必须整棵 dist/zcode 上传：latest.json 与 releases/<ver>/ 的相对结构是 install.sh 的契约
          # （install.sh 按 `${BASE_URL}/latest.json` 与 `${BASE_URL}/releases/$VERSION/$TARBALL` 取文件）
          path: |
            dist/zcode/latest.json
            dist/zcode/install.sh
            dist/zcode/releases/*/zcode-*.tar.gz
            dist/zcode/releases/*/sha256.txt

      - name: Summary
        env:
          DIST_BASE_URL: ${{ inputs.dist_base_url || vars.ZCODE_DIST_BASE_URL }}
        run: |
          {
            echo "### Web + Agent 发行包 (linux-${{ matrix.arch }})"
            echo
            echo "把整个 \`dist/zcode/\` 目录上传到 \`$DIST_BASE_URL\`，保持目录结构不变。"
            echo
            echo "目标机安装（需预装 node>=24、curl、tar）："
            echo '```sh'
            echo "curl -fsSL $DIST_BASE_URL/install.sh | sh"
            echo 'zcode --web --host 0.0.0.0 --port 3030 --workspace /path/to/project'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────
  # 4) 发布到 GitHub Release（仅 tag 触发）
  #    用 gh CLI 上传：与 softprops/action-gh-release 相比不用引入外部
  #    action，且 runner 自带的 gh 已认证。
  #    资产是扁平结构，与 install.sh 期望的 releases/<ver>/ 层级不同，
  #    因此 Release 仅作下载分发；装机器需改走自建站点或自设 ZCODE_DIST_BASE_URL。
  # ─────────────────────────────────────────────────────────
  publish-release:
    name: publish / ${{ github.ref_name }}
    needs: [desktop-windows, desktop-linux, web-agent-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 仓库默认 default_workflow_permissions=read，上传 Release 必须在此显式提权
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          set -euo pipefail
          # download-artifact 会按 artifact 名建子目录，而 Release 资产需要扁平
          mkdir -p flat
          find release-assets -type f -print0 | while IFS= read -r -d '' f; do
            name=$(basename "$f")
            if [ -e "flat/$name" ]; then
              echo "::error::资产名冲突: $name（来自 $f）" >&2
              exit 1
            fi
            cp "$f" "flat/$name"
          done
          ls -lh flat
          test -n "$(ls -A flat)" || { echo "::error::没有可发布的资产" >&2; exit 1; }

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 不能用 flat/* 通配：electron-builder 的 Preview 身份 productName 是
          # "ZCode Preview"（含空格），ZCODE_ENV=test 时产物名如
          # "ZCode Preview-3.14.0-linux-x86_64_TEST.AppImage"，shell 会把一个文件拆成多个参数。
          # 用 find -print0 + xargs -0 传递资产列表。
          mapfile -d '' ASSETS < <(find flat -maxdepth 1 -type f -print0 | sort -z)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::没有可发布的资产" >&2
            exit 1
          fi
          printf '待上传资产:\n'; printf '  %s\n' "${ASSETS[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            # --verify-tag：tag 由本地推送而来，不存在的 tag 不应静默新建
            gh release create "$TAG" --title "ZCode $TAG" --verify-tag --generate-notes \
              "${ASSETS[@]}"
          fi

      - name: Release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### 已发布 $TAG"
            echo
            gh release view "$TAG" --json url,assets \
              --jq '"Release: " + .url, "", "| 资产 | 大小 |", "| --- | --- |", (.assets[] | "| " + .name + " | " + ((.size/1048576*10|floor)/10|tostring) + " MiB |")'
          } >> "$GITHUB_STEP_SUMMARY"
